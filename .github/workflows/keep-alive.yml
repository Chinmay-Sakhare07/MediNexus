# Keeps the free-tier stack warm:
#   - Render free web services sleep after ~15 min of no traffic (30-60s cold start)
#   - Aiven free services power off after extended inactivity
# One GET to /health touches both (the endpoint runs SELECT 1 against MySQL).
#
# Setup (one time): repo → Settings → Secrets and variables → Actions →
#   Variables → New repository variable:
#     KEEPALIVE_URL = https://<your-service>.onrender.com/health
#
# Notes:
#   - GitHub cron is best-effort; runs can be delayed a few minutes. Fine here.
#   - ~4.4k short runs/month ≈ well under the free Actions minutes, and public
#     repos get standard runners free anyway.
#   - To save runs, narrow the schedule (e.g. "*/10 1-18 * * *" ≈ 6:30am-11:30pm IST).

name: Keep services awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (wakes Render, counts as Aiven activity)
        run: |
          URL="${{ vars.KEEPALIVE_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::Repository variable KEEPALIVE_URL is not set"
            exit 1
          fi
          # Generous retries: the very first hit after a cold sleep can take ~60s.
          curl -fsS --max-time 90 --retry 8 --retry-delay 10 --retry-all-errors "$URL"
          echo
          echo "Ping OK: $(date -u)"

      - name: Ping LogBase /health (optional; keeps the Fly app warm)
        run: |
          LB="${{ vars.LOGBASE_KEEPALIVE_URL }}"
          if [ -n "$LB" ]; then
            curl -fsS --max-time 90 --retry 5 --retry-delay 10 --retry-all-errors "$LB" || true
            echo "LogBase ping done: $(date -u)"
          else
            echo "LOGBASE_KEEPALIVE_URL not set; skipping (wake-then-send covers cold starts)."
          fi
